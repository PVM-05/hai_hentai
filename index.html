<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Album Hải Hentai - Bộ Sưu Tập Tuyển Chọn</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔥</text></svg>">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0e0e0e;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    /* Top Brand Navigation Bar */
    .site-nav {
      width: 100%;
      background: #161616;
      border-bottom: 1px solid #282828;
      padding: 10px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 500;
    }

    .brand-logo {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -0.5px;
      text-decoration: none;
      color: #fff;
      cursor: pointer;
    }

    .brand-logo .brand-badge {
      background-color: #ff9000;
      color: #000000;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 19px;
      font-weight: 900;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .nav-link {
      color: #b0b0b0;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: color 0.15s;
    }

    .nav-link:hover, .nav-link.active {
      color: #ff9000;
    }

    .search-box {
      display: flex;
      align-items: center;
      background: #252525;
      border: 1px solid #383838;
      border-radius: 20px;
      padding: 5px 14px;
      width: 220px;
      transition: all 0.2s;
    }

    .search-box:focus-within {
      border-color: #ff9000;
      background: #202020;
      width: 260px;
    }

    .search-box input {
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 13px;
      width: 100%;
    }

    .search-box input::placeholder {
      color: #777;
    }

    /* Main Container matching screenshot layout */
    .main-wrapper {
      width: 100%;
      max-width: 1024px;
      background-color: #131313;
      margin: 16px auto 40px auto;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }

    /* Title Bar */
    .title-header {
      padding: 22px 20px 14px 20px;
      border-bottom: 1px solid #252525;
    }

    .media-title {
      font-size: 32px;
      font-weight: 500;
      color: #f1f1f1;
      letter-spacing: -0.3px;
      line-height: 1.25;
      word-break: break-word;
      transition: opacity 0.2s;
    }

    /* Viewer / Screen Area */
    .screen-container {
      position: relative;
      width: 100%;
      background: #000000;
      aspect-ratio: 1024 / 510;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: pointer;
    }

    .active-image {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    /* Screen Nav Overlay (Next / Prev arrows) */
    .screen-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      opacity: 0;
      transition: opacity 0.2s ease;
      background: linear-gradient(to bottom, rgba(0,0,0,0.2) 0%, transparent 20%, transparent 80%, rgba(0,0,0,0.3) 100%);
      pointer-events: none;
    }

    .screen-container:hover .screen-overlay {
      opacity: 1;
    }

    .nav-arrow-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(20, 20, 20, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      pointer-events: auto;
      transition: all 0.15s ease;
      backdrop-filter: blur(4px);
    }

    .nav-arrow-btn:hover {
      background: #e43828;
      border-color: #e43828;
      transform: scale(1.08);
    }

    .nav-arrow-btn:active {
      transform: scale(0.95);
    }

    .screen-top-badge {
      position: absolute;
      top: 14px;
      right: 14px;
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #eee;
      padding: 4px 12px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 600;
      backdrop-filter: blur(4px);
      pointer-events: auto;
    }

    /* Bottom Info & Stats Section (Exact replica of original image) */
    .meta-details {
      padding: 16px 16px 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Row 1: Episodes (Left) and Stats (Right) */
    .controls-row-1 {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .episodes-bar {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .ep-button {
      height: 62px;
      padding: 0 24px;
      border-radius: 8px;
      font-size: 26px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.1s ease, background-color 0.15s ease;
      user-select: none;
      border: none;
      outline: none;
    }

    .ep-button:active {
      transform: scale(0.96);
    }

    .ep-button.active {
      background-color: #e43828;
      color: #ffffff;
    }

    .ep-button.inactive {
      background-color: #242424;
      color: #ffffff;
    }

    .ep-button.inactive:hover {
      background-color: #323232;
    }

    /* 4 Stat Badges matching original */
    .stats-container {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .stat-pill {
      height: 62px;
      background-color: #242424;
      border-radius: 8px;
      padding: 0 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 25px;
      font-weight: 600;
      color: #ffffff;
      cursor: pointer;
      transition: background-color 0.15s, transform 0.1s;
    }

    .stat-pill:hover {
      background-color: #2e2e2e;
    }

    .stat-pill:active {
      transform: scale(0.97);
    }

    .stat-icon {
      width: 28px;
      height: 28px;
      display: block;
      stroke: #ffffff;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      flex-shrink: 0;
    }

    .stat-icon.heart-filled {
      fill: #fa2b4d;
      stroke: #fa2b4d;
    }

    .stat-pill.liked {
      background-color: #1f364d;
    }
    .stat-pill.liked .stat-icon {
      stroke: #3897f0;
      fill: rgba(56, 151, 240, 0.25);
    }

    .stat-pill.disliked {
      background-color: #442222;
    }
    .stat-pill.disliked .stat-icon {
      stroke: #ff4747;
      fill: rgba(255, 71, 71, 0.25);
    }

    .heart-pulse .stat-icon {
      animation: heartPulse 0.45s ease;
    }

    @keyframes heartPulse {
      0% { transform: scale(1); }
      40% { transform: scale(1.35); }
      100% { transform: scale(1); }
    }

    /* Row 2: Code badge */
    .controls-row-2 {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .code-pill {
      height: 56px;
      background-color: #242424;
      border-radius: 8px;
      padding: 0 20px;
      font-size: 24px;
      font-weight: 500;
      color: #e5e5e5;
      display: inline-flex;
      align-items: center;
      cursor: pointer;
      transition: background-color 0.15s, transform 0.1s;
    }

    .code-pill:hover {
      background-color: #303030;
      color: #fff;
    }

    .code-pill:active {
      transform: scale(0.98);
    }

    /* Gallery Section (Thư viện Album Hải Hentai) */
    .gallery-section {
      width: 100%;
      max-width: 1024px;
      margin: 0 auto 60px auto;
      padding: 0 10px;
    }

    .gallery-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid #262626;
    }

    .gallery-title {
      font-size: 22px;
      font-weight: 700;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .gallery-count {
      color: #888;
      font-size: 14px;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }

    .album-card {
      background: #191919;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      border: 1px solid #2a2a2a;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
    }

    .album-card:hover {
      transform: translateY(-4px);
      border-color: #e43828;
      box-shadow: 0 8px 24px rgba(228, 56, 40, 0.2);
    }

    .album-card.active-card {
      border-color: #e43828;
      background: #201818;
    }

    .card-thumb-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      overflow: hidden;
    }

    .card-thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .album-card:hover .card-thumb {
      transform: scale(1.05);
    }

    .card-badge-ep {
      position: absolute;
      top: 8px;
      left: 8px;
      background: #e43828;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
      letter-spacing: 0.5px;
    }

    .card-badge-hd {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 3px;
    }

    .card-info {
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .card-title {
      font-size: 16px;
      font-weight: 600;
      color: #f0f0f0;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #999;
      font-size: 12px;
      margin-top: 4px;
    }

    .card-code {
      background: #2c2c2c;
      color: #ff9000;
      padding: 2px 6px;
      border-radius: 3px;
      font-weight: 600;
      font-family: monospace;
    }

    /* Lightbox Modal */
    .lightbox-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.95);
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .lightbox-modal.open {
      display: flex;
    }

    .lightbox-img {
      max-width: 95vw;
      max-height: 92vh;
      object-fit: contain;
      border-radius: 4px;
      box-shadow: 0 0 30px rgba(0,0,0,0.8);
    }

    .lightbox-close {
      position: absolute;
      top: 20px;
      right: 24px;
      background: rgba(40, 40, 40, 0.8);
      border: 1px solid #555;
      color: #fff;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      font-size: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }

    .lightbox-close:hover {
      background: #e43828;
      border-color: #e43828;
    }

    /* Toast Notification */
    .toast-msg {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #252525;
      border: 1px solid #444;
      color: #fff;
      padding: 10px 22px;
      border-radius: 30px;
      font-size: 14px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.6);
      transition: all 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
      opacity: 0;
      pointer-events: none;
      z-index: 3000;
    }

    .toast-msg.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* Responsive Queries */
    @media (max-width: 960px) {
      .media-title {
        font-size: 24px;
      }
      .ep-button {
        height: 50px;
        padding: 0 16px;
        font-size: 20px;
      }
      .stat-pill {
        height: 50px;
        padding: 0 14px;
        font-size: 19px;
        gap: 8px;
      }
      .stat-icon {
        width: 22px;
        height: 22px;
      }
      .code-pill {
        height: 48px;
        font-size: 19px;
        padding: 0 16px;
      }
    }

    @media (max-width: 640px) {
      .site-nav {
        padding: 10px 14px;
        flex-wrap: wrap;
      }
      .nav-links {
        display: none;
      }
      .search-box {
        width: 140px;
      }
      .title-header {
        padding: 16px 14px 12px 14px;
      }
      .media-title {
        font-size: 19px;
      }
      .ep-button {
        height: 42px;
        padding: 0 14px;
        font-size: 17px;
      }
      .stats-container {
        gap: 8px;
      }
      .stat-pill {
        height: 42px;
        padding: 0 10px;
        font-size: 15px;
        gap: 6px;
      }
      .stat-icon {
        width: 18px;
        height: 18px;
      }
      .code-pill {
        height: 42px;
        font-size: 16px;
      }
      .cards-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <!-- Top Navigation Bar -->
  <header class="site-nav">
    <a href="#" class="brand-logo" onclick="selectEpisode(0); return false;">
      HẢI<span class="brand-badge">HENTAI</span>
    </a>

    <nav class="nav-links">
      <a href="#" class="nav-link active" onclick="selectEpisode(0); return false;">Album Tuyển Chọn</a>
      <a href="#gallerySection" class="nav-link">Thư Viện Ảnh</a>
      <a href="https://github.com/PVM-05/HAI.EXE" target="_blank" class="nav-link">GitHub Repo</a>
    </nav>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Tìm kiếm album...">
    </div>
  </header>

  <!-- Main Viewer (Exact Meme Screenshot replica) -->
  <main class="main-wrapper">

    <!-- Title Section -->
    <section class="title-header">
      <h1 class="media-title" id="displayTitle">Thanh niên bị nấc ngẩn người trong giờ học</h1>
    </section>

    <!-- Screen / Image Area -->
    <section class="screen-container" id="screenViewer" title="Nhấp vào để xem ảnh phóng to">
      <img src="./images/nac_ngan_nguoi.jpg" alt="Meme preview" class="active-image" id="mainDisplayImg">

      <!-- Navigation Arrows Overlay -->
      <div class="screen-overlay">
        <button class="nav-arrow-btn" id="btnPrev" title="Tập trước (Phím mũi tên Trái)">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <button class="nav-arrow-btn" id="btnNext" title="Tập tiếp theo (Phím mũi tên Phải)">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>

      <div class="screen-top-badge" id="screenCounter">Tập 1 / 2</div>
    </section>

    <!-- Meta Details & Statistics Section -->
    <section class="meta-details">
      <!-- Row 1: Episodes and Stats -->
      <div class="controls-row-1">
        <!-- Episode badges (#1, #2) -->
        <div class="episodes-bar" id="episodesContainer">
          <!-- Dynamically populated -->
        </div>

        <!-- 4 Stats Badges matching screenshot -->
        <div class="stats-container">
          <!-- Like -->
          <div class="stat-pill" id="pillLike" title="Thích">
            <span class="stat-val" id="valLike">2.884</span>
            <svg class="stat-icon" viewBox="0 0 24 24">
              <path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/>
            </svg>
          </div>

          <!-- Dislike -->
          <div class="stat-pill" id="pillDislike" title="Không thích">
            <span class="stat-val" id="valDislike">1.374</span>
            <svg class="stat-icon" viewBox="0 0 24 24">
              <path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3zm7-13h3a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-3"/>
            </svg>
          </div>

          <!-- Heart -->
          <div class="stat-pill" id="pillHeart" title="Tỷ lệ yêu thích">
            <span class="stat-val" id="valHeart">68%</span>
            <svg class="stat-icon heart-filled" viewBox="0 0 24 24">
              <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>
          </div>

          <!-- Views -->
          <div class="stat-pill" id="pillView" title="Lượt xem">
            <span class="stat-val" id="valView">3.3M</span>
            <svg class="stat-icon" viewBox="0 0 24 24">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </div>
        </div>
      </div>

      <!-- Row 2: Code badge (CMT8-1945) -->
      <div class="controls-row-2">
        <div class="code-pill" id="pillCode" title="Nhấp để sao chép mã tác phẩm">
          CMT8-1945
        </div>
      </div>
    </section>
  </main>

  <!-- Gallery Section -->
  <section class="gallery-section" id="gallerySection">
    <div class="gallery-header">
      <h2 class="gallery-title">🔥 Thư Viện Album Hải Hentai</h2>
      <span class="gallery-count" id="galleryCount">2 tác phẩm</span>
    </div>

    <div class="cards-grid" id="cardsGrid">
      <!-- Dynamically generated cards -->
    </div>
  </section>

  <!-- Lightbox Modal -->
  <div class="lightbox-modal" id="lightboxModal">
    <button class="lightbox-close" id="btnCloseLightbox" title="Đóng (ESC)">✕</button>
    <img src="" alt="Full preview" class="lightbox-img" id="lightboxImg">
  </div>

  <!-- Toast Notification -->
  <div class="toast-msg" id="toastMsg">Thông báo</div>

  <script>
    // Album Data
    const albumList = [
      {
        id: 1,
        title: "Thanh niên bị nấc ngẩn người trong giờ học",
        code: "CMT8-1945",
        image: "./images/nac_ngan_nguoi.jpg",
        likes: "2.884",
        dislikes: "1.374",
        heart: "68%",
        views: "3.3M",
        quality: "4K HD"
      },
      {
        id: 2,
        title: "Gakuen de jikan - Ngưng đọng thời gian học đường",
        code: "GDJ-1945",
        image: "./images/gakuen_de_jikan.png",
        likes: "4.520",
        dislikes: "128",
        heart: "98%",
        views: "5.7M",
        quality: "1080P"
      }
    ];

    let currentIndex = 0;

    // Elements
    const displayTitle = document.getElementById('displayTitle');
    const mainDisplayImg = document.getElementById('mainDisplayImg');
    const screenCounter = document.getElementById('screenCounter');
    const episodesContainer = document.getElementById('episodesContainer');
    const cardsGrid = document.getElementById('cardsGrid');
    const galleryCount = document.getElementById('galleryCount');
    const searchInput = document.getElementById('searchInput');

    const valLike = document.getElementById('valLike');
    const valDislike = document.getElementById('valDislike');
    const valHeart = document.getElementById('valHeart');
    const valView = document.getElementById('valView');
    const pillCode = document.getElementById('pillCode');

    const pillLike = document.getElementById('pillLike');
    const pillDislike = document.getElementById('pillDislike');
    const pillHeart = document.getElementById('pillHeart');

    const btnPrev = document.getElementById('btnPrev');
    const btnNext = document.getElementById('btnNext');
    const screenViewer = document.getElementById('screenViewer');

    const lightboxModal = document.getElementById('lightboxModal');
    const lightboxImg = document.getElementById('lightboxImg');
    const btnCloseLightbox = document.getElementById('btnCloseLightbox');
    const toastMsg = document.getElementById('toastMsg');

    function notify(text) {
      toastMsg.textContent = text;
      toastMsg.classList.add('show');
      clearTimeout(window._toastTimeout);
      window._toastTimeout = setTimeout(() => {
        toastMsg.classList.remove('show');
      }, 2300);
    }

    // Render Episode Buttons
    function renderEpisodeButtons() {
      episodesContainer.innerHTML = '';
      albumList.forEach((item, idx) => {
        const btn = document.createElement('button');
        btn.className = `ep-button ${idx === currentIndex ? 'active' : 'inactive'}`;
        btn.textContent = `#${item.id}`;
        btn.title = item.title;
        btn.addEventListener('click', () => {
          selectEpisode(idx);
        });
        episodesContainer.appendChild(btn);
      });
    }

    // Render Album Grid Cards
    function renderCards(filterText = '') {
      cardsGrid.innerHTML = '';
      const filtered = albumList.filter(item => 
        item.title.toLowerCase().includes(filterText.toLowerCase()) || 
        item.code.toLowerCase().includes(filterText.toLowerCase())
      );

      galleryCount.textContent = `${filtered.length} tác phẩm`;

      filtered.forEach(item => {
        const originalIndex = albumList.findIndex(a => a.id === item.id);
        const card = document.createElement('article');
        card.className = `album-card ${originalIndex === currentIndex ? 'active-card' : ''}`;
        card.innerHTML = `
          <div class="card-thumb-wrapper">
            <img src="${item.image}" alt="${item.title}" class="card-thumb" loading="lazy">
            <span class="card-badge-ep">TẬP ${item.id}</span>
            <span class="card-badge-hd">${item.quality}</span>
          </div>
          <div class="card-info">
            <h3 class="card-title">${item.title}</h3>
            <div class="card-meta-row">
              <span class="card-code">${item.code}</span>
              <span>👁️ ${item.views} • ❤️ ${item.heart}</span>
            </div>
          </div>
        `;
        card.addEventListener('click', () => {
          selectEpisode(originalIndex);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
        cardsGrid.appendChild(card);
      });
    }

    // Select and Switch Episode
    function selectEpisode(index) {
      if (index < 0) index = albumList.length - 1;
      if (index >= albumList.length) index = 0;
      currentIndex = index;

      const current = albumList[currentIndex];

      // Smooth switch transition
      mainDisplayImg.style.opacity = '0';
      setTimeout(() => {
        mainDisplayImg.src = current.image;
        mainDisplayImg.style.opacity = '1';
      }, 150);

      displayTitle.textContent = current.title;
      valLike.textContent = current.likes;
      valDislike.textContent = current.dislikes;
      valHeart.textContent = current.heart;
      valView.textContent = current.views;
      pillCode.textContent = current.code;
      screenCounter.textContent = `Tập ${currentIndex + 1} / ${albumList.length}`;

      // Reset like/dislike status
      pillLike.classList.remove('liked');
      pillDislike.classList.remove('disliked');

      renderEpisodeButtons();
      renderCards(searchInput.value);
    }

    // Prev / Next Buttons
    btnPrev.addEventListener('click', (e) => {
      e.stopPropagation();
      selectEpisode(currentIndex - 1);
    });

    btnNext.addEventListener('click', (e) => {
      e.stopPropagation();
      selectEpisode(currentIndex + 1);
    });

    // Keyboard navigation
    window.addEventListener('keydown', (e) => {
      if (lightboxModal.classList.contains('open')) {
        if (e.key === 'Escape') closeLightbox();
        if (e.key === 'ArrowLeft') selectEpisode(currentIndex - 1), openLightbox(albumList[currentIndex].image);
        if (e.key === 'ArrowRight') selectEpisode(currentIndex + 1), openLightbox(albumList[currentIndex].image);
        return;
      }

      if (e.key === 'ArrowLeft') selectEpisode(currentIndex - 1);
      if (e.key === 'ArrowRight') selectEpisode(currentIndex + 1);
    });

    // Lightbox handling
    function openLightbox(src) {
      lightboxImg.src = src;
      lightboxModal.classList.add('open');
    }

    function closeLightbox() {
      lightboxModal.classList.remove('open');
    }

    screenViewer.addEventListener('click', (e) => {
      if (e.target.closest('.nav-arrow-btn')) return;
      openLightbox(albumList[currentIndex].image);
    });

    btnCloseLightbox.addEventListener('click', closeLightbox);
    lightboxModal.addEventListener('click', (e) => {
      if (e.target === lightboxModal) closeLightbox();
    });

    // Copy Code
    pillCode.addEventListener('click', () => {
      const code = pillCode.textContent.trim();
      navigator.clipboard.writeText(code).then(() => {
        notify(`Đã sao chép mã: ${code}`);
      }).catch(() => {
        notify(`Mã tác phẩm: ${code}`);
      });
    });

    // Interactive Stats
    pillLike.addEventListener('click', () => {
      const isLiked = pillLike.classList.toggle('liked');
      if (isLiked) {
        pillDislike.classList.remove('disliked');
        notify('Đã thích tác phẩm 👍');
      }
    });

    pillDislike.addEventListener('click', () => {
      const isDisliked = pillDislike.classList.toggle('disliked');
      if (isDisliked) {
        pillLike.classList.remove('liked');
        notify('Đã không thích 👎');
      }
    });

    pillHeart.addEventListener('click', () => {
      pillHeart.classList.remove('heart-pulse');
      void pillHeart.offsetWidth;
      pillHeart.classList.add('heart-pulse');
      notify('Đã thả tim vào album ❤️');
    });

    // Live search
    searchInput.addEventListener('input', (e) => {
      renderCards(e.target.value.trim());
    });

    // Initialize
    renderEpisodeButtons();
    renderCards();
  </script>
</body>
</html>
